<div class="tasks-card">
  <div class="tasks-header">
    <div>
      <h3>Daily Tasks</h3>
      <p>{{ completedCount }} of {{ totalCount }} tasks completed</p>
    </div>
    <div class="percent">{{ progressPercent }}%</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">Progress</div>
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
    </div>
  </div>

  <!-- ✅ SEARCH + FILTERS -->
  <div class="task-filters">
    <input
      class="search"
      [(ngModel)]="searchTerm"
      placeholder="Search title or notes..."
    />

    <select class="select" [(ngModel)]="filterType">
      <option value="ALL">All Types</option>
      <option value="MEDICATION">MEDICATION</option>
      <option value="MEAL">MEAL</option>
      <option value="EXERCISE">EXERCISE</option>
      <option value="APPOINTMENT">APPOINTMENT</option>
      <option value="SOCIAL">SOCIAL</option>
      <option value="OTHER">OTHER</option>
    </select>

    <select class="select" [(ngModel)]="filterStatus">
      <option value="ALL">All</option>
      <option value="TODO">To do</option>
      <option value="DONE">Done</option>
    </select>

    <select class="select" [(ngModel)]="sortMode">
      <option value="TIME">Sort: Time</option>
      <option value="TITLE">Sort: Title</option>
      <option value="TYPE">Sort: Type</option>
    </select>
  </div>

  <div class="task-list">

    <div class="empty" *ngIf="displayedTasks.length === 0">
      No matching tasks. Try changing filters or add a new one.
    </div>

    <!-- TASK ROW -->
    <div class="task-row"
         *ngFor="let t of displayedTasks; trackBy: trackByTaskId"
         [class.done]="t.completed">

      <label class="left">
        <input type="checkbox"
               [checked]="t.completed"
               (change)="toggle(t)" />

        <div class="meta">

          <!-- TITLE WITH ICON -->
          <div class="title">
            <span class="ico"
              [ngClass]="t.taskType === 'MEDICATION' ? 'i-pill'
                      : t.taskType === 'MEAL' ? 'i-heart'
                      : t.taskType === 'EXERCISE' ? 'i-walk'
                      : t.taskType === 'SOCIAL' ? 'i-drop'
                      : 'i-sparkle'">
            </span>

            {{ t.title }}
          </div>

          <!-- SUB INFO -->
          <div class="sub">
            <span class="pill">{{ t.taskType }}</span>
            <span class="time">{{ t.scheduledTime }}</span>
          </div>

          <!-- NOTES -->
          <div class="notes" *ngIf="t.notes">
            {{ t.notes }}
          </div>

        </div>
      </label>

      <!-- ACTION BUTTONS -->
      <div class="actions">
        <button class="btn-icon"
                (click)="openEdit(t)"
                title="Edit">
          ✏️
        </button>

        <button class="btn-icon danger"
                (click)="remove(t); $event.stopPropagation(); $event.preventDefault()"
                title="Delete">
          🗑️
        </button>
      </div>

    </div>
  </div>
</div>

<!-- FLOATING ADD BUTTON -->
<button class="fab" (click)="openAdd()">+</button>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="isModalOpen">
  <div class="modal">

    <h3>{{ isEditing ? 'Edit Task' : 'Add Task' }}</h3>

    <label>Title</label>
    <input [(ngModel)]="currentTask.title"
           placeholder="e.g. Drink water" />

    <label>Task Type</label>
    <select [(ngModel)]="currentTask.taskType">
      <option value="MEDICATION">MEDICATION</option>
      <option value="MEAL">MEAL</option>
      <option value="EXERCISE">EXERCISE</option>
      <option value="APPOINTMENT">APPOINTMENT</option>
      <option value="SOCIAL">SOCIAL</option>
      <option value="OTHER">OTHER</option>
    </select>

    <label>Scheduled Time</label>
    <input type="time"
           [(ngModel)]="currentTask.scheduledTime" />

    <label>Notes</label>
    <textarea rows="3"
              [(ngModel)]="currentTask.notes"></textarea>

    <div class="modal-actions">
      <button class="btn" (click)="closeModal()">Cancel</button>
      <button class="btn primary" (click)="save()">Save</button>
    </div>

  </div>
</div>
