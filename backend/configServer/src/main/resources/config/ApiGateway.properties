spring.application.name=api-gateway
server.port=8089


# ==================== EUREKA ====================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==================== CORS ====================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# ==================== LOGGING ====================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG


# ==================== ROUTES ====================
spring.cloud.gateway.routes[0].id=medical-record-service
spring.cloud.gateway.routes[0].uri=lb://medical-record-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/medical-records/**

spring.cloud.gateway.routes[1].id=appointment-service
spring.cloud.gateway.routes[1].uri=lb://appointment-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/appointments/**

spring.cloud.gateway.routes[2].id=activities-service
spring.cloud.gateway.routes[2].uri=lb://activities-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[4].id=dailyme-service
spring.cloud.gateway.routes[4].uri=lb://dailyme-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/dailyme/**

spring.cloud.gateway.routes[5].id=user-service
spring.cloud.gateway.routes[5].uri=lb://user-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/users/(?<segment>.*), /EverCare/users/${segment}

spring.cloud.gateway.routes[6].id=auth-service
spring.cloud.gateway.routes[6].uri=lb://user-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/auth/(?<segment>.*), /EverCare/auth/${segment}

spring.cloud.gateway.routes[7].id=communication-service
spring.cloud.gateway.routes[7].uri=lb://communication-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/communication-service/**

spring.cloud.gateway.routes[8].id=dailyme-service-alt
spring.cloud.gateway.routes[8].uri=lb://dailyme-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/dailyme/**

# ==================== DOCKER (uncomment + comment above when running in Docker) ====================
# eureka.client.serviceUrl.defaultZone=http://eureka-service:8761/eureka/
