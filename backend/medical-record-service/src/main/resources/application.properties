spring.application.name=medical-record-service
spring.config.import=optional:configserver:http://localhost:8888
server.port=8082

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:h2:file:./Database/Data/MedicalRecord;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2

user.service.url=http://localhost:8096/EverCare

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.medical-record.exchange=medical.record.exchange
app.rabbitmq.medical-record.queue=medical.record.queue
app.rabbitmq.medical-record.routing-key=medical.record.events
